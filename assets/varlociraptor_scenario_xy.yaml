species:
  heterozygosity: 0.001
  germline-mutation-rate: 1e-3
  ploidy:
    all: 2
    chrX: 1
    chrY: 1

samples:
  tumor:
    somatic-effective-mutation-rate: 1e-6
    inheritance:
      clonal:
        from: normal
        somatic: true
  normal:
    somatic-effective-mutation-rate: 1e-6

events:
  somatic_tumor_low:   "normal:0.0 & tumor:]0.0,0.1["
  somatic_tumor_high:  "normal:0.0 & tumor:[0.1,1.0]"
  shared_clonal:       "normal:]0.0,0.5[ & tumor:]0.0,1.0]"
  somatic_normal_only: "normal:]0.0,0.5[ & tumor:0.0"
  germline_het:        "normal:0.5"
  germline_het_gain:   "normal:]0.5,1.0["
  germline_hom:        "normal:1.0"
